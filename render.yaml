services:
  - type: web
    name: automated-retraining-api
    runtime: python
    plan: free
    region: oregon
    rootDir: automated-model-retraining
    buildCommand: pip install -r requirements.txt && python src/train.py
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: MODEL_PATH
        value: models/model.pkl
