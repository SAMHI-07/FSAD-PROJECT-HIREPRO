name: Automated model retraining
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "data/production/**"
      - "src/**"
      - ".github/workflows/retrain.yml"
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    outputs:
      drift: ${{ steps.drift.outputs.drift }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare Evidently runtime
        working-directory: .
        run: python src/prepare_environment.py
      - name: Check production drift
        id: drift
        working-directory: .
        env:
          DRIFT_THRESHOLD: ${{ vars.DRIFT_THRESHOLD || '0.30' }}
        run: |
          set +e
          python src/drift_detection.py
          code=$?
          if [ "$code" -eq 1 ]; then echo "drift=true" >> "$GITHUB_OUTPUT"; elif [ "$code" -eq 0 ]; then echo "drift=false" >> "$GITHUB_OUTPUT"; else exit "$code"; fi
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: monitoring/*.html
          if-no-files-found: ignore
  retrain:
    needs: monitor
    if: github.event_name == 'workflow_dispatch' || needs.monitor.outputs.drift == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare Evidently runtime
        working-directory: .
        run: python src/prepare_environment.py
      - name: Train, validate, and promote
        working-directory: .
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || format('sqlite:///{0}/mlflow.db', github.workspace) }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          MLFLOW_MODEL_NAME: churn-predictor
        run: python src/retrain.py
      - name: Upload model and MLflow run data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-and-mlflow-runs
          path: |
            models/
            mlflow.db
            mlartifacts/
          if-no-files-found: ignore










